services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: valcore_user
      POSTGRES_PASSWORD: valcore_password
      POSTGRES_DB: valcore_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
